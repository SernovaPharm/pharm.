<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>نظام فواتير متكامل ومتطور - تصميم مهندس بولس سمير جرس</title>
    
    <!-- Bootstrap 5 RTL + Icons + Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- SheetJS لتصدير Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary: #1a1a2e;
            --primary-dark: #0f0f1a;
            --secondary: #16213e;
            --accent: #e94560;
            --success: #0f3460;
            --warning: #e94560;
            --light-bg: #1a1a2e;
            --card-bg: rgba(22, 33, 62, 0.9);
            --glass-bg: rgba(22, 33, 62, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --text: #e0e0e0;
            --text-light: #b0b0b0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        * {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text);
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(233,69,96,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(15,52,96,0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(233,69,96,0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Modern Sidebar with Glass Effect */
        .sidebar {
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            min-height: 100vh;
            color: white;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1000;
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        
        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(233,69,96,0.15) 0%, rgba(15,52,96,0.2) 50%, rgba(22,33,62,0.1) 100%);
            pointer-events: none;
        }
        
        .sidebar .nav-link {
            color: rgba(255,255,255,0.85);
            padding: 13px 18px;
            margin: 6px 10px;
            border-radius: var(--radius-sm);
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
            font-weight: 500;
            letter-spacing: 0.3px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(-5px);
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-color: rgba(255,255,255,0.2);
        }
        
        .sidebar .nav-link.active {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            color: white;
            font-weight: 700;
            box-shadow: 0 8px 25px rgba(233,69,96,0.4);
            border-color: rgba(255,255,255,0.3);
        }
        
        .sidebar .nav-link i {
            margin-left: 10px;
            width: 22px;
            font-size: 1.2em;
            transition: transform 0.3s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        
        .sidebar .nav-link:hover i {
            transform: scale(1.2) rotate(-5deg);
        }

        /* Main Content */
        .main-content {
            padding: 30px;
            position: relative;
            min-height: 100vh;
            z-index: 1;
        }

        /* Top Bar with Glass Effect */
        .top-bar {
            background: rgba(22, 33, 62, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            padding: 18px 25px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .top-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(233,69,96,0.05), rgba(15,52,96,0.05));
            pointer-events: none;
        }

        /* Cards with Glass Effect */
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            padding: 25px 20px;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
            border-color: rgba(255,255,255,0.2);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-card .icon {
            font-size: 2.5rem;
            position: relative;
            z-index: 1;
            transition: transform 0.3s;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        
        .stat-card:hover .icon {
            transform: scale(1.15) rotate(-8deg);
        }
        
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 800;
            position: relative;
            z-index: 1;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            color: #ffffff;
        }
        
        .stat-card .label {
            color: #b0b0b0;
            font-weight: 600;
        }

        /* Table Card with Glass Effect */
        .table-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            animation: fadeInUp 0.5s ease;
        }
        
        .table thead th {
            background: linear-gradient(135deg, #0f3460 0%, #e94560 100%);
            color: white;
            border: none;
            padding: 14px 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .table tbody td {
            color: #e0e0e0;
            background: rgba(22, 33, 62, 0.5);
        }

        /* Buttons */
        .btn {
            border-radius: var(--radius-sm);
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #e94560 0%, #c23152 100%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(233,69,96,0.3);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(233,69,96,0.5);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #0f3460 0%, #0a2540 100%);
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(15,52,96,0.4);
            color: white;
        }
        
        .btn-info {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Modal */
        .modal-content {
            background: rgba(22, 33, 62, 0.98);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
            animation: modalSlideIn 0.3s ease;
            color: #e0e0e0;
        }
        
        .modal-header {
            background: linear-gradient(135deg, #0f3460 0%, #e94560 100%);
            color: white;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            border: none;
        }

        /* Search Box */
        .search-box input {
            padding-right: 45px;
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
            background: rgba(22, 33, 62, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #e0e0e0;
        }
        
        .search-box input:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 4px rgba(233,69,96,0.2);
            background: rgba(22, 33, 62, 0.9);
        }
        
        .search-box input::placeholder {
            color: #888;
        }

        .form-control, .form-select {
            background: rgba(22, 33, 62, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e0e0e0;
        }
        
        .form-control:focus, .form-select:focus {
            background: rgba(22, 33, 62, 0.9);
            border-color: #e94560;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(233,69,96,0.2);
        }

        @keyframes modalSlideIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Optimizations */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 1100;
                transform: translateX(100%);
                width: 280px;
                transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
            }
            .sidebar.show {
                transform: translateX(0);
            }
            .main-content {
                padding: 15px;
            }
            .stat-card .value {
                font-size: 1.3rem;
            }
            .stat-card {
                padding: 18px 15px;
            }
        }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <!-- Sidebar -->
        <div class="col-md-2 col-lg-2 sidebar p-3" id="sidebar">
            <div class="text-center mb-4">
                <div style="background: linear-gradient(135deg, #0f3460, #e94560, #16213e); width: 70px; height: 70px; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 8px 25px rgba(233,69,96,0.4);">

        </div>
        
        <!-- Mobile Overlay -->
        <div class="d-md-none" id="sidebarOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1050;" onclick="toggleSidebar()"></div>
        
        <!-- Main Content -->
        <div class="col-md-10 col-lg-10 main-content">
            <div class="top-bar d-flex justify-content-between align-items-center">

                    <i class="fas fa-bars"></i>

                <h4 id="pageTitle" class="fw-bold mb-0" style="color: #ffffff;">لوحة التحكم</h4>
                <div>
                    <span id="dateTime" class="fw-bold" style="color: #e94560;"></span>

            <div id="pageContent">

        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    // ==================== FIREBASE INITIALIZATION ====================
    const firebaseConfig = {
        apiKey: "AIzaSyByFRuK3zXJbBKKs1OIntPkTB6Jq65yq4U",
        authDomain: "company-63941.firebaseapp.com",
        databaseURL: "https://company-63941-default-rtdb.firebaseio.com",
        projectId: "company-63941",
        storageBucket: "company-63941.firebasestorage.app",
        messagingSenderId: "664032762429",
        appId: "1:664032762429:web:cff94ce07773c84bb92854",
        measurementId: "G-34P7RLX4JC"
    };
    
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // ==================== DATA MODELS ====================
    let appData = {
        customers: [],
        products: [],
        salesInvoices: [],
        purchaseInvoices: [],
        payments: [],
        settings: {
            companyName: '',
            companyAddress: '',
            companyPhone: '',
            currency: 'جنيه مصري',
            maxDiscountPercent: 30,
            adminUser: 'admin',
            adminPassword: 'admin123'
        }
    };
    
    let currentInvoiceNumber = 1000;
    let currentPurchaseNumber = 2000;
    let currentPage = 'dashboard';
    let firebaseSyncEnabled = true;
    
    // Load data from Firebase
    function loadData() {
        // Try Firebase first
        if (firebaseSyncEnabled) {
            database.ref('appData').once('value').then((snapshot) => {
                const firebaseData = snapshot.val();
                if (firebaseData) {
                    appData = firebaseData;
                    // Ensure currency is always جنيه مصري
                    if (!appData.settings) appData.settings = {};
                    appData.settings.currency = 'جنيه مصري';
                    updateInvoiceNumbers();
                    renderDashboard();
                    console.log('✅ تم تحميل البيانات من Firebase');
                } else {
                    loadFromLocalStorage();
                }
            }).catch((error) => {
                console.error('Firebase error:', error);
                loadFromLocalStorage();
                firebaseSyncEnabled = false;
            });
        } else {
            loadFromLocalStorage();
        }
    }
    
    function loadFromLocalStorage() {
        const saved = localStorage.getItem('invoiceSystemDataV2');
        if (saved) {
            appData = JSON.parse(saved);
            // Ensure currency is always جنيه مصري
            if (!appData.settings) appData.settings = {};
            appData.settings.currency = 'جنيه مصري';
        }
        if (!appData.customers || appData.customers.length === 0) {
            addSampleData();
        }
        updateInvoiceNumbers();
        renderDashboard();
    }
    
    function saveData() {
        // Always enforce currency
        if (!appData.settings) appData.settings = {};
        appData.settings.currency = 'جنيه مصري';
        
        // Save to localStorage
        localStorage.setItem('invoiceSystemDataV2', JSON.stringify(appData));
        
        // Save to Firebase
        if (firebaseSyncEnabled) {
            database.ref('appData').set(appData).then(() => {
                console.log('✅ تم حفظ البيانات في Firebase');
            }).catch((error) => {
                console.error('Firebase save error:', error);
                firebaseSyncEnabled = false;
            });
        }
    }
    
    function addSampleData() {
        appData.customers = [
            { id: 1, name: 'محمد أحمد', phone: '0551111111', address: 'الرياض', type: 'customer', discountPercent: 5 },
            { id: 2, name: 'شركة التوريدات', phone: '0552222222', address: 'جدة', type: 'supplier', discountPercent: 0 },
            { id: 3, name: 'علي حسن', phone: '0553333333', address: 'الدمام', type: 'customer', discountPercent: 10 }
        ];
        
        appData.products = [
            { id: 1, name: 'لابتوب Dell', unit: 'قطعة', buyPrice: 2500, sellPrice: 3000, quantity: 10, minQuantity: 2, profit: 500, initialQuantity: 10 },
            { id: 2, name: 'ماوس لاسلكي', unit: 'قطعة', buyPrice: 50, sellPrice: 80, quantity: 50, minQuantity: 10, profit: 30, initialQuantity: 50 },
            { id: 3, name: 'طابعة HP', unit: 'قطعة', buyPrice: 400, sellPrice: 550, quantity: 5, minQuantity: 3, profit: 150, initialQuantity: 5 }
        ];
        
        appData.salesInvoices = [
            {
                id: 1,
                invoiceNumber: 'INV-1001',
                customerId: 1,
                date: new Date().toISOString(),
                items: [{ productId: 1, quantity: 1, price: 3000, total: 3000 }],
                subtotal: 3000,
                discount: 150,
                extra: 0,
                total: 2850,
                paid: 2000,
                due: 850,
                status: 'partial'
            }
        ];
        
        appData.purchaseInvoices = [];
        appData.settings.currency = 'جنيه مصري';
        saveData();
    }
    
    function updateInvoiceNumbers() {
        if (appData.salesInvoices.length > 0) {
            const maxNum = Math.max(...appData.salesInvoices.map(i => parseInt(i.invoiceNumber.split('-')[1]) || 0));
            currentInvoiceNumber = maxNum + 1;
        }
        if (appData.purchaseInvoices.length > 0) {
            const maxNum = Math.max(...appData.purchaseInvoices.map(i => parseInt(i.invoiceNumber.split('-')[1]) || 0));
            currentPurchaseNumber = maxNum + 1;
        }
    }
    
    function generateInvoiceNumber() {
        return `INV-${currentInvoiceNumber++}`;
    }
    
    function generatePurchaseNumber() {
        return `PUR-${currentPurchaseNumber++}`;
    }
    
    function formatCurrency(amount) {
        return `${amount?.toFixed(2) || '0.00'} ${appData.settings.currency || 'جنيه مصري'}`;
    }
    
    // Format phone number for WhatsApp
    function formatPhoneForWhatsApp(phone) {
        // Remove any non-digit characters
        let cleaned = phone.replace(/\D/g, '');
        
        // If number starts with 0, remove it
        if (cleaned.startsWith('0')) {
            cleaned = cleaned.substring(1);
        }
        
        // Add Egypt country code (0020) if not already present
        if (!cleaned.startsWith('20')) {
            cleaned = '20' + cleaned;
        }
        
        return cleaned;
    }
    
    // ==================== UI HELPERS ====================
    function showModal(html, id) {
        const existing = document.getElementById(id);
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', html);
        new bootstrap.Modal(document.getElementById(id)).show();
    }
    
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('show');
        if (overlay) {
            overlay.style.display = sidebar.classList.contains('show') ? 'block' : 'none';
        }
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }
    
    function updateDateTime() {
        const now = new Date();
        document.getElementById('dateTime').innerHTML = now.toLocaleString('ar');
    }
    
    // ==================== RENDER FUNCTIONS ====================
    
    function renderDashboard() {
        const totalSalesDue = appData.salesInvoices.reduce((sum, inv) => sum + inv.due, 0);
        const totalPurchaseDue = appData.purchaseInvoices.reduce((sum, inv) => sum + inv.due, 0);
        // Fixed: Today payments should be 0 since no relation with registration
        const todayPayments = 0;
        const unpaidInvoices = appData.salesInvoices.filter(inv => inv.due > 0).length;
        const totalProducts = appData.products.length;
        
        const html = `
            <div class="row g-3">

    function getCustomerTotal(customerId) {
        const salesTotal = appData.salesInvoices.filter(inv => inv.customerId === customerId).reduce((sum, inv) => sum + inv.total, 0);
        const purchaseTotal = appData.purchaseInvoices.filter(inv => inv.supplierId === customerId).reduce((sum, inv) => sum + inv.total, 0);
        return salesTotal + purchaseTotal;
    }
    
    function getCustomerPaid(customerId) {
        const salesPaid = appData.salesInvoices.filter(inv => inv.customerId === customerId).reduce((sum, inv) => sum + inv.paid, 0);
        const purchasePaid = appData.purchaseInvoices.filter(inv => inv.supplierId === customerId).reduce((sum, inv) => sum + inv.paid, 0);
        return salesPaid + purchasePaid;
    }
    
    function getCustomerDue(customerId) {
        return getCustomerTotal(customerId) - getCustomerPaid(customerId);
    }

    function sendWhatsApp(invoiceId) {
        const invoice = appData.salesInvoices.find(inv => inv.id === invoiceId);
        if (!invoice) return;
        const customer = appData.customers.find(c => c.id === invoice.customerId);
        if (!customer?.phone) { alert('لا يوجد رقم هاتف للعميل'); return; }
        
        const formattedPhone = formatPhoneForWhatsApp(customer.phone);
        const message = `*فاتورة بيع*\nالرقم: ${invoice.invoiceNumber}\nالتاريخ: ${new Date(invoice.date).toLocaleDateString('ar')}\nالإجمالي: ${formatCurrency(invoice.total)}\nالمدفوع: ${formatCurrency(invoice.paid)}\nالمتبقي: ${formatCurrency(invoice.due)}\nشكراً لتعاملكم معنا`;
        window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`, '_blank');
    }

        const invoice = appData.purchaseInvoices.find(inv => inv.id === invoiceId);

        const supplier = appData.customers.find(c => c.id === invoice.supplierId);
        if (!supplier?.phone) { alert('لا يوجد رقم هاتف للمورد'); return; }
        
        const formattedPhone = formatPhoneForWhatsApp(supplier.phone);
        const message = `*فاتورة شراء*\nالرقم: ${invoice.invoiceNumber}\nالتاريخ: ${new Date(invoice.date).toLocaleDateString('ar')}\nالإجمالي: ${formatCurrency(invoice.total)}\nالمدفوع: ${formatCurrency(invoice.paid)}\nالمتبقي: ${formatCurrency(invoice.due)}`;
        window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function updateItemPrice(index) {
        const productSelect = document.getElementById(`itemProduct_${index}`);
        const productId = parseInt(productSelect.value);
        const product = appData.products.find(p => p.id === productId);
        if (product) {
            document.getElementById(`itemPrice_${index}`).value = product.sellPrice;
            window.invoiceItemsList[index].price = product.sellPrice;
            window.invoiceItemsList[index].productId = productId;
            updateItemTotal(index);
        }
    }
    
    function updatePurchaseItemPrice(index) {
        const productSelect = document.getElementById(`purchaseItemProduct_${index}`);
        const productId = parseInt(productSelect.value);
        const product = appData.products.find(p => p.id === productId);
        if (product) {
            document.getElementById(`purchaseItemPrice_${index}`).value = product.buyPrice;
            window.purchaseItemsList[index].price = product.buyPrice;
            window.purchaseItemsList[index].productId = productId;
            updatePurchaseItemTotal(index);
        }
    }
    
    function updateItemTotal(index) {
        const qty = parseFloat(document.getElementById(`itemQty_${index}`).value) || 0;
        const price = parseFloat(document.getElementById(`itemPrice_${index}`).value) || 0;
        const total = qty * price;
        const productSelect = document.getElementById(`itemProduct_${index}`);
        const productId = parseInt(productSelect.value);
        const product = appData.products.find(p => p.id === productId);
        const warningEl = document.getElementById(`stockWarning_${index}`);
        
        if (product && qty > product.quantity) {
            if (warningEl) {
                warningEl.classList.remove('d-none');
                warningEl.textContent = `⚠️ تحذير: المخزون المتوفر (${product.quantity}) غير كافٍ للكمية المطلوبة (${qty})`;
            }
            document.getElementById(`itemQty_${index}`).style.borderColor = '#e94560';
            document.getElementById(`itemQty_${index}`).style.boxShadow = '0 0 0 3px rgba(233,69,96,0.2)';
        } else {
            if (warningEl) warningEl.classList.add('d-none');
            document.getElementById(`itemQty_${index}`).style.borderColor = '';
            document.getElementById(`itemQty_${index}`).style.boxShadow = '';
        }
        
        document.getElementById(`itemTotal_${index}`).value = total.toFixed(2);
        window.invoiceItemsList[index].quantity = qty;
        window.invoiceItemsList[index].price = price;
        window.invoiceItemsList[index].total = total;
        calculateInvoiceTotal();
    }
    
    function updatePurchaseItemTotal(index) {
        const qty = parseFloat(document.getElementById(`purchaseItemQty_${index}`).value) || 0;
        const price = parseFloat(document.getElementById(`purchaseItemPrice_${index}`).value) || 0;
        const total = qty * price;
        document.getElementById(`purchaseItemTotal_${index}`).value = total.toFixed(2);
        window.purchaseItemsList[index].quantity = qty;
        window.purchaseItemsList[index].price = price;
        window.purchaseItemsList[index].total = total;
        calculatePurchaseTotal();
    }
    
    function removeInvoiceItemRow(index) {

        window.invoiceItemsList.splice(index, 1);

    function removePurchaseItemRow(index) {
        document.getElementById(`purchaseItemRow_${index}`).remove();
        window.purchaseItemsList.splice(index, 1);

    function calculateInvoiceTotal() {
        const subtotal = window.invoiceItemsList.reduce((sum, item) => sum + (item.total || 0), 0);
        const discountPercent = parseFloat(document.getElementById('invoiceDiscount')?.value) || 0;
        const extra = parseFloat(document.getElementById('invoiceExtra')?.value) || 0;
        const discountAmount = (subtotal * discountPercent) / 100;
        const total = subtotal - discountAmount + extra;
        if (document.getElementById('invoiceTotal')) {
            document.getElementById('invoiceTotal').value = total.toFixed(2);
            calculateDue();
        }
        window.currentInvoiceTotal = total;
    }
    
    function calculatePurchaseTotal() {
        const subtotal = window.purchaseItemsList.reduce((sum, item) => sum + (item.total || 0), 0);
        const extra = parseFloat(document.getElementById('purchaseExtra')?.value) || 0;
        const total = subtotal + extra;
        if (document.getElementById('purchaseTotal')) {
            document.getElementById('purchaseTotal').value = total.toFixed(2);
            calculatePurchaseDue();
        }
    }
    
    function calculateDue() {
        const total = parseFloat(document.getElementById('invoiceTotal')?.value) || 0;
        const paid = parseFloat(document.getElementById('invoicePaid')?.value) || 0;
        document.getElementById('invoiceDue').value = (total - paid).toFixed(2);
    }
    
    function calculatePurchaseDue() {
        const total = parseFloat(document.getElementById('purchaseTotal')?.value) || 0;
        const paid = parseFloat(document.getElementById('purchasePaid')?.value) || 0;
        document.getElementById('purchaseDue').value = (total - paid).toFixed(2);
    }
    
    function saveSaleInvoice() {
        const customerId = parseInt(document.getElementById('customerSelect').value);
        if (!customerId) { alert('الرجاء اختيار العميل'); return; }
        
        const items = window.invoiceItemsList.filter(item => item.productId).map(item => {
            const product = appData.products.find(p => p.id === item.productId);
            if (product && item.quantity > product.quantity) {
                throw new Error(`الكمية المطلوبة من ${product.name} (${item.quantity}) أكبر من المخزون المتوفر (${product.quantity})`);
            }
            return { productId: item.productId, quantity: item.quantity, price: item.price, total: item.total };
        });
        
        try {
            for (const item of items) {
                const product = appData.products.find(p => p.id === item.productId);
                if (product && item.quantity > product.quantity) {
                    alert(`⚠️ المخزون غير كافٍ لمنتج "${product.name}". المتوفر: ${product.quantity}، المطلوب: ${item.quantity}`);
                    return;
                }
            }
        } catch (e) {
            alert(e.message);
            return;
        }
        
        if (items.length === 0) { alert('الرجاء إضافة منتج واحد على الأقل'); return; }
        
        const total = parseFloat(document.getElementById('invoiceTotal').value);
        const paid = parseFloat(document.getElementById('invoicePaid').value);
        const due = total - paid;
        
        const newInvoice = {
            id: Date.now(),
            invoiceNumber: generateInvoiceNumber(),
            customerId: customerId,
            date: document.getElementById('invoiceDate').value,
            items: items,
            subtotal: window.invoiceItemsList.reduce((sum, i) => sum + i.total, 0),
            discount: (window.invoiceItemsList.reduce((sum, i) => sum + i.total, 0) * (parseFloat(document.getElementById('invoiceDiscount').value) || 0)) / 100,
            extra: parseFloat(document.getElementById('invoiceExtra').value) || 0,
            total: total,
            paid: paid,
            due: due,
            status: due === 0 ? 'paid' : 'partial'
        };
        
        appData.salesInvoices.push(newInvoice);
        items.forEach(item => {
            const product = appData.products.find(p => p.id === item.productId);
            if (product) {
                if (product.initialQuantity === undefined) product.initialQuantity = product.quantity;
                product.quantity -= item.quantity;
            }
        });
        
        saveData();
        bootstrap.Modal.getInstance(document.getElementById('saleModal')).hide();
        renderSalesInvoices();
        alert('✅ تم حفظ الفاتورة بنجاح');
    }
    
    function savePurchaseInvoice() {
        const supplierId = parseInt(document.getElementById('supplierSelect').value);
        if (!supplierId) { alert('الرجاء اختيار المورد'); return; }
        
        const items = window.purchaseItemsList.filter(item => item.productId).map(item => ({
            productId: item.productId, quantity: item.quantity, price: item.price, total: item.total
        }));
        
        if (items.length === 0) { alert('الرجاء إضافة منتج واحد على الأقل'); return; }
        
        const total = parseFloat(document.getElementById('purchaseTotal').value);
        const paid = parseFloat(document.getElementById('purchasePaid').value);
        const due = total - paid;
        
        const newInvoice = {
            id: Date.now(),
            invoiceNumber: generatePurchaseNumber(),
            supplierId: supplierId,
            date: document.getElementById('purchaseDate').value,
            items: items,
            subtotal: window.purchaseItemsList.reduce((sum, i) => sum + i.total, 0),
            extra: parseFloat(document.getElementById('purchaseExtra').value) || 0,
            total: total,
            paid: paid,
            due: due,
            status: due === 0 ? 'paid' : 'partial'
        };
        
        appData.purchaseInvoices.push(newInvoice);
        items.forEach(item => {
            const product = appData.products.find(p => p.id === item.productId);
            if (product) {
                if (product.initialQuantity === undefined) product.initialQuantity = product.quantity;
                product.quantity += item.quantity;
            }
        });
        
        saveData();
        bootstrap.Modal.getInstance(document.getElementById('purchaseModal')).hide();
        renderPurchaseInvoices();
        alert('✅ تم حفظ فاتورة الشراء بنجاح');
    }

    function addPayment(invoiceId) {
        const invoice = appData.salesInvoices.find(inv => inv.id === invoiceId);
        if (!invoice) return;
        const amount = prompt(`💰 المبلغ المتبقي: ${formatCurrency(invoice.due)}\nأدخل مبلغ الدفعة:`);
        if (amount && !isNaN(amount)) {
            const paymentAmount = parseFloat(amount);
            if (paymentAmount > invoice.due) { alert('المبلغ أكبر من المتبقي'); return; }
            invoice.paid += paymentAmount;
            invoice.due -= paymentAmount;
            invoice.status = invoice.due === 0 ? 'paid' : 'partial';
            if (!appData.payments) appData.payments = [];
            appData.payments.push({ id: Date.now(), invoiceId: invoiceId, amount: paymentAmount, date: new Date().toISOString() });
            saveData();
            if (currentPage === 'sales') renderSalesInvoices();
            else if (currentPage === 'dashboard') renderDashboard();
            else renderSalesInvoices();
            alert('✅ تم تسجيل الدفعة بنجاح');
        }
    }
    
    function addPurchasePayment(invoiceId) {
        const invoice = appData.purchaseInvoices.find(inv => inv.id === invoiceId);
        if (!invoice) return;
        const amount = prompt(`💰 المبلغ المتبقي: ${formatCurrency(invoice.due)}\nأدخل مبلغ الدفعة:`);
        if (amount && !isNaN(amount)) {
            const paymentAmount = parseFloat(amount);
            if (paymentAmount > invoice.due) { alert('المبلغ أكبر من المتبقي'); return; }
            invoice.paid += paymentAmount;
            invoice.due -= paymentAmount;
            invoice.status = invoice.due === 0 ? 'paid' : 'partial';
            saveData();
            renderPurchaseInvoices();
            alert('✅ تم تسجيل الدفعة بنجاح');
        }
    }

    function exportToExcel() {
        const wsData = [
            ['النوع', 'رقم الفاتورة', 'الطرف', 'التاريخ', 'الإجمالي', 'المدفوع', 'المتبقي'],
            ...[...appData.salesInvoices.map(inv => {

                return ['بيع', inv.invoiceNumber, customer?.name, inv.date, inv.total, inv.paid, inv.due];
            }), ...appData.purchaseInvoices.map(inv => {
                const supplier = appData.customers.find(c => c.id === inv.supplierId);
                return ['شراء', inv.invoiceNumber, supplier?.name, inv.date, inv.total, inv.paid, inv.due];
            })]
        ];
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'التقارير');
        XLSX.writeFile(wb, `تقرير_المبيعات_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    function backupData() {
        const dataStr = JSON.stringify(appData, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        alert('✅ تم تصدير النسخة الاحتياطية بنجاح');
    }
    
    function restoreData() {
        const fileInput = document.getElementById('restoreFile');
        if (!fileInput.files.length) { alert('الرجاء اختيار ملف JSON'); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const restoredData = JSON.parse(e.target.result);
                if (confirm('سيتم استبدال جميع البيانات. هل أنت متأكد؟')) {
                    appData = restoredData;
                    // Enforce currency
                    if (!appData.settings) appData.settings = {};
                    appData.settings.currency = 'جنيه مصري';
                    saveData();
                    alert('✅ تم استعادة البيانات بنجاح');
                    location.reload();
                }
            } catch (error) { alert('خطأ في قراءة الملف'); }
        };
        reader.readAsText(fileInput.files[0]);
    }
    
    function renderSettings() {
        const html = `
            <div class="table-card">
                <h5 style="color: #ffffff;">⚙️ الإعدادات العامة</h5>
                <hr>
                <div class="mb-3"><label class="fw-bold">اسم الشركة</label><input type="text" class="form-control" id="companyName" value="" placeholder="أدخل اسم الشركة"></div>
                <div class="mb-3"><label class="fw-bold">عنوان الشركة</label><input type="text" class="form-control" id="companyAddress" value="" placeholder="أدخل عنوان الشركة"></div>
                <div class="mb-3"><label class="fw-bold">رقم الهاتف</label><input type="text" class="form-control" id="companyPhone" value="" placeholder="أدخل رقم الهاتف"></div>
                <div class="mb-3"><label class="fw-bold">العملة الأساسية</label><input type="text" class="form-control" id="currency" value="جنيه مصري" readonly style="background: rgba(22,33,62,0.9); cursor: not-allowed;"></div>
                <div class="mb-3"><label class="fw-bold">أقصى نسبة خصم مسموحة (%)</label><input type="number" class="form-control" id="maxDiscount" value="30"></div>
                <button class="btn btn-primary rounded-pill" onclick="saveSettings()">حفظ الإعدادات</button>
            </div>
        `;
        document.getElementById('pageContent').innerHTML = html;
        document.getElementById('pageTitle').innerHTML = '⚙️ الإعدادات';
        
        // Populate fields if data exists
        if (appData.settings.companyName) document.getElementById('companyName').value = appData.settings.companyName;
        if (appData.settings.companyAddress) document.getElementById('companyAddress').value = appData.settings.companyAddress;
        if (appData.settings.companyPhone) document.getElementById('companyPhone').value = appData.settings.companyPhone;
        if (appData.settings.maxDiscountPercent) document.getElementById('maxDiscount').value = appData.settings.maxDiscountPercent;
    }
    
    function saveSettings() {
        appData.settings.companyName = document.getElementById('companyName').value;
        appData.settings.companyAddress = document.getElementById('companyAddress').value;
        appData.settings.companyPhone = document.getElementById('companyPhone').value;
        appData.settings.currency = 'جنيه مصري'; // Always fixed
        appData.settings.maxDiscountPercent = parseFloat(document.getElementById('maxDiscount').value) || 30;
        saveData();
        alert('✅ تم حفظ الإعدادات');
    }
    
    // ==================== NAVIGATION ====================
    document.querySelectorAll('[data-page]').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const page = link.getAttribute('data-page');
            currentPage = page;
            document.querySelectorAll('[data-page]').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            
            switch(page) {
                case 'dashboard': renderDashboard(); break;
                case 'customers': renderCustomers(); break;
                case 'products': renderProducts(); break;
                case 'sales': renderSalesInvoices(); break;
                case 'purchases': renderPurchaseInvoices(); break;
                case 'reports': renderReports(); break;
                case 'backup': renderBackup(); break;
                case 'settings': renderSettings(); break;
                default: renderDashboard();
            }
            
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.remove('show');
                document.getElementById('sidebarOverlay').style.display = 'none';
            }
        });
    });
    
    // Initialize
    loadData();
    setInterval(updateDateTime, 1000);
    updateDateTime();
    
    window.addEventListener('resize', () => {
        if (window.innerWidth >= 768) {
            document.getElementById('sidebar').classList.remove('show');
            const overlay = document.getElementById('sidebarOverlay');
            if (overlay) overlay.style.display = 'none';
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
